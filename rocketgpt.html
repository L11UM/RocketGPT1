<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rocket 2.0 | AI Chat</title>
  <meta name="description" content="Ask anything, keep chats organized, and share useful answers with Rocket 2.0." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Rocket 2.0 | AI Chat" />
  <meta property="og:description" content="Ask anything, keep chats organized, and share useful answers with Rocket 2.0." />
  <meta property="og:url" content="https://rocketgpt.net/" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/svg+xml" href="rocketgpt-logo.svg" />
  <meta name="api-base-url" content="https://rocketgpt1.onrender.com" />
  <link rel="stylesheet" href="rocketgpt.css?v=chat-library" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><img class="brand-mark" src="rocketgpt-logo.svg" alt="" /><div class="brand-copy"><div class="brand-name">Rocket 2.0</div><div class="brand-credit">AI CHAT WORKSPACE</div></div></div>
      <button class="new-chat" id="newChat"><span class="plus" aria-hidden="true">+</span><span>New chat</span><kbd>⌘ K</kbd></button>
      <section class="history-section" aria-label="Chat history">
        <label class="history-search"><span aria-hidden="true">⌕</span><input id="historySearch" type="search" placeholder="Search chats" aria-label="Search chats" /></label>
        <div class="history-heading">RECENT</div>
        <div class="thread-list" id="threadList" role="list"></div>
        <p class="history-privacy">Saved only in this browser</p>
      </section>
      <div class="side-bottom">
        <div class="local-status"><span class="status-dot"></span><div><strong>Gemini engine</strong><small>HIGH-REASONING MODE</small></div></div>
      </div>
    </aside>
    <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Close chat history" hidden></button>

    <main class="main">
      <header class="topbar"><div class="topbar-kicker"><button class="mobile-history" id="mobileHistory" type="button" aria-expanded="false" aria-controls="threadList">Chats</button><span>ROCKET 2.0</span><span class="topbar-divider">/</span><span>AI CHAT</span></div><div class="topbar-model"><span class="model-dot" aria-hidden="true"></span>GEMINI AI</div></header>
      <div class="chat-wrap">
        <section class="empty-state" id="emptyState">
          <div class="welcome-mark"><img class="welcome-logo" src="rocketgpt-logo.svg" alt="Rocket 2.0 logo" /><span>ROCKET 2.0</span></div>
          <h1>What can I help with?</h1>
          <p class="empty-copy">Ask anything, or start with a prompt.</p>
          <div class="prompt-grid" aria-label="Prompt ideas">
            <button class="suggestion" type="button" data-prompt="Help me think through this problem and recommend a practical next step: "><span class="suggestion-index">01</span><strong>Think through a problem</strong><span class="suggestion-detail">Compare options and tradeoffs</span></button>
            <button class="suggestion" type="button" data-prompt="Help me make a clear project plan with milestones and next steps: "><span class="suggestion-index">02</span><strong>Plan a project</strong><span class="suggestion-detail">Turn a goal into concrete steps</span></button>
            <button class="suggestion" type="button" data-prompt="Help me write a clear first draft about: "><span class="suggestion-index">03</span><strong>Write a first draft</strong><span class="suggestion-detail">Start from a rough idea</span></button>
          </div>
        </section>
        <section class="messages" id="messages" aria-live="polite"></section>
        <div class="composer-area"><form class="composer" id="composer"><textarea id="prompt" rows="1" placeholder="Message Rocket 2.0" aria-label="Message Rocket 2.0"></textarea><button class="send" aria-label="Send message">↑</button></form><div class="composer-meta"><span>AI can make mistakes. Check important info.</span><span>⌘ ↵ to send</span></div></div>
      </div>
    </main>
  </div>
  <script src="rocketgpt.js?v=chat-library" defer></script>
</body>
</html>
