services:
  - type: web
    name: rocketgpt-api
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-4-argon
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.8-flash,gemini-3.6-flash,gemini-3.5-flash-lite
      - key: GEMINI_THINKING_LEVEL
        value: HIGH
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: '8192'
      - key: GEMINI_SEARCH_ENABLED
        value: 'true'
      - key: GEMINI_CODE_EXECUTION_ENABLED
        value: 'true'
      - key: ALLOWED_ORIGIN
        value: https://rocketgpt.net,https://l11um.github.io
