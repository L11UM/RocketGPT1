services:
  - type: web
    name: rocketgpt-api
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: '8192'
      - key: ALLOWED_ORIGIN
        value: https://rocketgpt.net,https://l11um.github.io
